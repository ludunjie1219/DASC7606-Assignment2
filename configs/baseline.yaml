model:
  vocab_size: 8192
  block_size: 256
  n_layer: 6
  n_head: 6
  n_embd: 384
  dropout: 0.1
  attention_backend: manual
training:
  seed: 1337
  batch_size: 16
  gradient_accumulation: 1
  max_steps: 2500
  learning_rate: 0.0006
  min_lr: 0.00006
  warmup_steps: 100
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bfloat16
  eval_interval: 250
  eval_batches: 20
  log_interval: 50
