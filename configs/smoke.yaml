model:
  vocab_size: 8192
  block_size: 64
  n_layer: 2
  n_head: 4
  n_embd: 128
  dropout: 0.0
  attention_backend: manual
training:
  seed: 1337
  batch_size: 4
  gradient_accumulation: 2
  max_steps: 20
  learning_rate: 0.001
  min_lr: 0.0001
  warmup_steps: 2
  weight_decay: 0.1
  grad_clip: 1.0
  precision: bfloat16
  eval_interval: 10
  eval_batches: 2
  log_interval: 5
